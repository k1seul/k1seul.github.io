<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">GSDS storage: application and access checks</title>
  <desc id="desc">Check your GSDS identity, apply to a LAAL admin, have a matching storage account registered, then verify your path and permissions. The service is not open yet.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#526179"/></marker></defs>
  <rect width="800" height="410" rx="8" fill="#ffffff"/>
  <g font-family="Noto Sans CJK KR, Inter, system-ui, sans-serif" fill="#152438">
    <text x="30" y="38" font-size="22" font-weight="700">GSDS storage · Getting access</text>
    <text x="30" y="69" font-size="14" fill="#526179">Not open yet. Registration and assigned paths will be announced after launch.</text>
    <rect x="30" y="100" width="330" height="110" rx="6" fill="#f3f6fa" stroke="#b5c1d0"/>
    <text x="48" y="130" font-size="17" font-weight="700">1. Check your GSDS account</text>
    <text x="48" y="161" font-size="15">Sign in with your GSDS account</text>
    <text x="48" y="187" font-size="14">Check your username and groups</text>
<rect x="440" y="100" width="330" height="110" rx="6" fill="#f3f6fa" stroke="#b5c1d0"/>
    <text x="458" y="130" font-size="17" font-weight="700">2. Apply to a LAAL admin</text>
    <text x="458" y="161" font-size="15">Send identity, purpose, capacity</text>
    <text x="458" y="187" font-size="14">Do not send passwords</text>
<rect x="440" y="245" width="330" height="110" rx="6" fill="#eef5ff" stroke="#b5c1d0"/>
    <text x="458" y="275" font-size="17" font-weight="700">3. Admin registers storage access</text>
    <text x="458" y="306" font-size="15">Match GSDS UID/GID and groups</text>
    <text x="458" y="332" font-size="14">Set folder permissions and limits</text>
<rect x="30" y="245" width="330" height="110" rx="6" fill="#f3f6fa" stroke="#b5c1d0"/>
    <text x="48" y="275" font-size="17" font-weight="700">4. Verify your assigned space</text>
    <text x="48" y="306" font-size="15">Check your path and ownership</text>
    <text x="48" y="332" font-size="14">Test reads and writes in your folder</text>
    <path d="M360 155 H440 M605 210 V245 M440 300 H360" fill="none" stroke="#526179" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M360 155 H440" fill="none" stroke="#526179" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M605 210 V245" fill="none" stroke="#526179" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="30" y="389" font-size="14">No password sharing or separate SSH login to the storage server is needed.</text>
  </g>
</svg>
