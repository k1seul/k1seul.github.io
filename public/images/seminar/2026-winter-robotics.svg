    <text x="48" y="174" font-size="17" font-weight="700">Advanced VLA</text>
    <text x="48" y="197" font-size="13" fill="#526179">10 papers · memory, RL, data</text>
    <text x="48" y="238" font-size="14">π0.7 · MolmoAct2</text>
    <text x="48" y="264" font-size="14">MEM · NativeMEM</text>
    <text x="48" y="290" font-size="14">RL Token · EgoScale</text>
    <text x="48" y="316" font-size="14">OpenVLA-OFT · π*0.6</text>
    <path d="M48 340 H247" stroke="#b5c1d0"/>
    <text x="48" y="366" font-size="13" fill="#526179">Frontier 7 · Advanced 3</text>

