    <rect x="300" y="86" width="230" height="40" rx="6" fill="#f3f6fa" stroke="#b5c1d0"/>
    <text x="318" y="111" font-size="15" font-weight="700">8 weekly sessions</text>
    <text x="548" y="111" font-size="13" fill="#526179">1 main talk + 2 × 5-min intros</text>

    <rect x="30" y="148" width="235" height="236" rx="6" fill="#f3f6fa" stroke="#b5c1d0"/>
