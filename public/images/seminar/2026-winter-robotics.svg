<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-labelledby="title desc">
  <title id="title">2026 Winter Robotics Study: reading map</title>
  <desc id="desc">The term opens with a NeurIPS Day in December, followed by eight weekly sessions. Thirty candidate papers fall under three themes: Advanced VLA with ten papers, World Action Models with twelve, and LLM as Policy with eight.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526179"/></marker>
  </defs>
  <rect width="800" height="410" rx="8" fill="#ffffff"/>
  <g font-family="Inter, system-ui, sans-serif" fill="#152438">
    <text x="30" y="40" font-size="22" font-weight="700">LAAL Robotics Seminar · 2026 Winter</text>
    <text x="30" y="66" font-size="15" fill="#526179">30 candidate papers across three themes</text>

    <rect x="30" y="86" width="210" height="40" rx="6" fill="#eef5ff" stroke="#637fa8"/>
    <text x="48" y="111" font-size="15" font-weight="700">NeurIPS Day · Dec</text>
